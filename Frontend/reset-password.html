<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Password — AuthSystem</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page-wrapper">
    <div class="auth-card">
        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon">🔐</div>
            <span class="brand-name">AuthSystem</span>
        </div>

        <!-- Header -->
        <div class="auth-header">
            <h1>Create New Password</h1>
            <p>Your new password must be different from previous used passwords.</p>
        </div>

        <div class="divider"></div>

        <!-- Alert Box -->
        <div class="alert alert-success" id="alertSuccess" role="alert">
            <span class="alert-icon">✅</span>
            <span id="alertSuccessMsg">Password reset successfully!</span>
        </div>
        <div class="alert alert-error" id="alertError" role="alert">
            <span class="alert-icon">⚠️</span>
            <span id="alertErrorMsg">Something went wrong.</span>
        </div>

        <!-- Reset Password Form -->
        <form id="resetForm" novalidate>
            
            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔑</span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control has-toggle"
                        placeholder="Min 8 chars, 1 uppercase, 1 number"
                        autocomplete="new-password"
                        required
                    />
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
                </div>
                <!-- Strength meter -->
                <div class="strength-bar-wrap" id="strengthBar">
                    <div class="strength-segment" id="seg1"></div>
                    <div class="strength-segment" id="seg2"></div>
                    <div class="strength-segment" id="seg3"></div>
                    <div class="strength-segment" id="seg4"></div>
                </div>
                <p class="strength-label" id="strengthLabel"></p>
                <p class="field-error" id="passwordError">⚡ Password must be 8+ chars with uppercase & number.</p>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm New Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        class="form-control has-toggle"
                        placeholder="Repeat your new password"
                        autocomplete="new-password"
                        required
                    />
                    <button type="button" class="toggle-password" id="toggleConfirm" aria-label="Toggle confirm password visibility">👁️</button>
                </div>
                <p class="field-error" id="confirmPasswordError">⚡ Passwords do not match.</p>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-primary" id="submitBtn">
                <span class="btn-text">
                    <span class="spinner" id="spinner"></span>
                    <span class="btn-label">Reset Password →</span>
                </span>
            </button>
        </form>

    </div>
</div>

<script src="js/reset-password.js"></script>
</body>
</html>
