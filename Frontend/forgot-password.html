<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — AuthSystem</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page-wrapper">
    <div class="auth-card">
        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon">🔐</div>
            <span class="brand-name">AuthSystem</span>
        </div>

        <!-- Header -->
        <div class="auth-header">
            <h1>Forgot Password?</h1>
            <p>Enter your email and we'll send you an OTP to reset your password.</p>
        </div>

        <div class="divider"></div>

        <!-- Alert Box -->
        <div class="alert alert-success" id="alertSuccess" role="alert">
            <span class="alert-icon">✅</span>
            <span id="alertSuccessMsg">OTP sent successfully!</span>
        </div>
        <div class="alert alert-error" id="alertError" role="alert">
            <span class="alert-icon">⚠️</span>
            <span id="alertErrorMsg">Something went wrong.</span>
        </div>

        <!-- Forgot Password Form -->
        <form id="forgotForm" novalidate>
            <!-- Email -->
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="john@example.com"
                        autocomplete="email"
                        required
                    />
                </div>
                <p class="field-error" id="emailError">⚡ Please enter a valid email address.</p>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-primary" id="submitBtn">
                <span class="btn-text">
                    <span class="spinner" id="spinner"></span>
                    <span class="btn-label">Send OTP →</span>
                </span>
            </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            Remember your password? <a href="login.html">Sign In</a>
        </div>
    </div>
</div>

<script src="js/forgot-password.js"></script>
</body>
</html>
